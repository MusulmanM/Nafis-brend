{% include "partials/form_errors.html" with form=form %}
<div class="mb-3">
  <div class="form-label">{{ form.reason.label }}</div>
  <div class="d-grid gap-2">
    {% for radio in form.reason %}
      <input type="radio" class="btn-check" name="{{ radio.data.name }}" id="{{ radio.id_for_label }}" value="{{ radio.data.value }}"{% if radio.data.selected %} checked{% endif %} required>
      <label class="btn btn-light text-start" for="{{ radio.id_for_label }}">{{ radio.choice_label }}</label>
    {% endfor %}
  </div>
  {% for error in form.reason.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
{% include "partials/field.html" with field=form.note %}
