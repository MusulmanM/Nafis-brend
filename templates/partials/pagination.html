{% load formatting %}
{% if page_obj.has_other_pages %}
<nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Sahifalar">
  <span class="small text-muted-2">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }} sahifa · jami {{ page_obj.paginator.count }}</span>
  <div class="d-flex gap-2">
    {% if page_obj.has_previous %}<a class="btn btn-light btn-sm" href="?{% url_replace page=page_obj.previous_page_number %}"><i class="bi bi-chevron-left"></i> Oldingi</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-light btn-sm" href="?{% url_replace page=page_obj.next_page_number %}">Keyingi <i class="bi bi-chevron-right"></i></a>{% endif %}
  </div>
</nav>
{% endif %}
